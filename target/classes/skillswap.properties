# =====================================================================
# Configuración de SkillSwap (se puede pisar con -Dclave=valor o con un
# archivo skillswap.properties en la carpeta desde donde se ejecuta).
# =====================================================================

# --- Base de datos -----------------------------------------------------
# mysql = MySQL real (producción del TP) | h2 = base embebida en memoria (demo)
db.modo=mysql
db.mysql.url=jdbc:mysql://localhost:3306/skillswap?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=3000
db.mysql.usuario=root
db.mysql.password=root
# Si MySQL no está disponible, arrancar igual con H2 para poder probar la UI.
db.fallbackH2=true
db.h2.url=jdbc:h2:mem:skillswap;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
db.h2.usuario=sa
db.h2.password=

# --- Reglas de negocio configurables -----------------------------------
# Comisión de la plataforma (Decorator)
precio.comisionPorcentaje=5
# Política de cancelación (Strategy): >=48h 100%, >=24h 50%, <24h 0%
cancelacion.horasReintegroTotal=48
cancelacion.horasReintegroParcial=24
cancelacion.porcentajeParcial=50
# Estrategia de recomendación (Strategy): afinidad | popularidad
recomendacion.estrategia=afinidad
recomendacion.cantidad=3
# Wallet
wallet.limiteCargaDemo=5000
pasarela.limiteCentavos=10000000

# --- Demo ----------------------------------------------------------------
demo.cargarDatos=true
